<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지식의 대장간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="fever-frame"></div>
<div id="popups"></div>

<div id="hud" class="hidden">
  <div class="hud-tl">
    <div class="brand">지식의 대장간 <small id="hud-course"></small></div>
    <div class="dayline"><b id="hud-day">1</b><span>/ <i id="hud-maxday">7</i>일째</span></div>
    <div class="candles" id="hud-candles" title="서고지기의 인내심"></div>
  </div>
  <div class="hud-tr">
    <div class="stat"><span>골드</span><b id="hud-gold">0</b></div>
    <div class="stat"><span>원석</span><b id="hud-blanks">0</b></div>
    <div class="stat"><span>완성한 검</span><b id="hud-fin">0</b></div>
    <div class="stat"><span>정답률</span><b id="hud-acc">-</b></div>
    <div class="tr-btns">
      <button id="btn-notes" class="ghost small">오답 노트</button>
      <button id="btn-sound" class="ghost small">소리 켬</button>
    </div>
  </div>
  <!-- 오늘의 요구: 화면 위 가운데에 크게, 걸어 둔 검으로 얼마나 채웠는지 함께 -->
  <div class="reqbox" id="reqbox"><div class="rq-top"><span class="rq-l">오늘 바칠 가치</span><b id="hud-req">0 G</b></div><div class="rq-bar"><i id="hud-reqbar"></i></div><div class="rq-sub" id="hud-reqsub"></div></div>
  <div class="hud-bl" id="hud-relics"></div>
  <div class="hint" id="hud-hint"></div>
  <div class="actions" id="actions">
    <button id="act-strike" class="primary"><kbd>Space</kbd>망치질</button>
    <button id="act-finish"><kbd>F</kbd>검 완성</button>
    <button id="act-reheat" class="hidden"><kbd>R</kbd>다시 달구기</button>
    <button id="act-leave"><kbd>Esc</kbd>자리 뜨기</button>
  </div>
  <div id="crosshair" class="hidden"></div>
  <button id="prompt" class="hidden"></button>
  <div id="joy" class="hidden"><div class="knob"></div></div>
  <div id="fever-bar"><div class="fill"></div><span>영감 — 문제 없이 마구 두드려라!</span></div>
</div>

<div id="qcard" class="hidden">
  <div class="q-meta"><span id="q-tag"></span><span id="q-risk"></span></div>
  <div class="q-text" id="q-text"></div>
  <div class="q-choices" id="q-choices"></div>
  <div class="q-timer hidden" id="q-timer"><div></div></div>
  <div class="q-explain hidden" id="q-explain"></div>
  <div class="q-foot">
    <button id="q-hint" class="ghost small">힌트 두루마리</button>
    <button id="q-go" class="primary hidden">확인 <kbd>Enter</kbd></button>
  </div>
</div>

<div id="banner"><div class="b-title"></div><div class="b-sub"></div></div>

<div id="modal" class="hidden"><div class="panel" id="panel"></div></div>

<div id="title-screen">
  <!-- 1단계: 타이틀 -->
  <div class="title-home" id="title-home">
    <h1 class="forge-title" aria-label="지식의 대장간">
      <span class="small" aria-hidden="true"><i>지</i><i>식</i><i>의</i></span>
      <span class="big" aria-hidden="true"><i>대</i><i>장</i><i>간</i></span>
    </h1>
    <p class="tagline">아는 만큼 단단해지는 검</p>
    <div class="home-actions">
      <button id="btn-start" class="forge-btn">시작하기</button>
      <nav class="home-links">
        <button id="btn-notes2" class="link">오답 노트</button>
        <button id="btn-howto" class="link">플레이 방법</button>
        <button id="btn-intro" class="link">프롤로그</button>
      </nav>
    </div>
  </div>
  <!-- 2단계: 학년·학기·과목 -->
  <div class="title-select hidden" id="title-select">
    <button id="btn-back" class="link back">← 처음 화면</button>
    <h2 class="forge-sub">무엇을 벼릴까</h2>
    <div class="pick"><div class="lbl">학년</div><div class="seg" id="sel-grade"></div></div>
    <div class="pick"><div class="lbl">학기</div><div class="seg" id="sel-sem"></div></div>
    <div class="pick"><div class="lbl">과목</div><div class="seg subj" id="sel-subj"></div></div>
    <div class="sel-info" id="sel-info"></div>
    <div class="sel-actions">
      <button id="btn-go" class="forge-btn">대장간 문 열기</button>
      <nav class="home-links">
        <label class="link check"><input type="checkbox" id="opt-timer"> 문제마다 20초</label>
        <button id="btn-qset" class="link">내 문제 세트</button>
      </nav>
    </div>
    <p class="qinfo" id="qinfo"></p>
  </div>
  <div class="credit">삼대710 제작</div>
</div>

<button id="btn-fs" class="ghost small" title="전체화면 (F11)">⛶ 전체화면</button>

<div id="cutscene" class="hidden">
  <div class="cs-bar top"></div><div class="cs-bar bottom"></div>
  <div id="cs-fade"></div>
  <div id="cs-sub"><div id="cs-name"></div><div id="cs-text"></div><div class="cs-more">▼</div></div>
  <button id="cs-skip" class="ghost small">건너뛰기 <kbd>Esc</kbd></button>
</div>

<div id="loading">불씨를 지피는 중…</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
